name: required-js-test-build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  required_js_test_build:
    name: required-js-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test:ci
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          pnpm run test:ci 2>&1 | tee .ci-logs/test-ci.log

      - name: Run build
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .ci-logs/build.log

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: required-js-test-build-logs
          path: .ci-logs/
          if-no-files-found: warn
          retention-days: 14
