name: required-android-build-test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  android_build_and_unit_test:
    name: Android Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/gradle/libs.versions.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundles
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          pnpm build 2>&1 | tee .ci-logs/js-build.log

      - name: Build Android debug APK
        shell: bash
        run: |
          set -o pipefail
          ./android/gradlew -p android :app:assembleDebug 2>&1 | tee .ci-logs/android-build.log

      - name: Run Android unit tests
        shell: bash
        run: |
          set -o pipefail
          ./android/gradlew -p android :app:testDebugUnitTest 2>&1 | tee .ci-logs/android-unit-tests.log

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-logs
          path: |
            .ci-logs/
            android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  android_instrumented_test:
    name: Android Instrumented Test
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/build.gradle.kts
            android/app/build.gradle.kts
            android/gradle/libs.versions.toml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Lynx bundles
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          pnpm build 2>&1 | tee .ci-logs/js-build.log

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 2
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048 -partition-size 2048 -accel on
          # emulator-runner invokes this via /usr/bin/sh on Ubuntu (dash),
          # which does not handle multi-line quoted strings or
          # `set -o pipefail`. Delegate to a dedicated bash script so Gradle's
          # exit status propagates and logcat dumps always run.
          script: bash scripts/ci/run-android-instrumented-tests.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-logs
          path: |
            .ci-logs/
            android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
